{% extends "layout.html" %}

{% block title %}
Login - RajaPulsa
{% endblock %}

{% block head %}
<style>

body{
    background:linear-gradient(135deg,#172554,#2563eb);
}

.wrapper{

    display:block;

}

.sidebar{

    display:none;

}

.main{

    margin:0;

}

.topbar{

    display:none;

}

.content{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.login-card{

    width:420px;

    background:#fff;

    border-radius:18px;

    padding:40px;

    box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.login-logo{

    font-size:56px;

    text-align:center;

}

.login-title{

    text-align:center;

    font-size:28px;

    font-weight:700;

    margin-top:10px;

}

.login-subtitle{

    text-align:center;

    color:#6b7280;

    margin-bottom:30px;

}

</style>
{% endblock %}

{% block content %}

<div class="login-card">

    <div class="login-logo">
        ⚡
    </div>

    <div class="login-title">
        RajaPulsa
    </div>

    <div class="login-subtitle">
        Admin Panel
    </div>

    <form action="/login" method="post">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Masukkan username"
                required
            >

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Masukkan password"
                required
            >

        </div>

        <button
            class="btn btn-primary w-100"
            type="submit">

            <i class="bi bi-box-arrow-in-right"></i>
            Login

        </button>

    </form>

    {% if error %}

    <div class="alert alert-danger mt-4">

        {{ error }}

    </div>

    {% endif %}

    <hr>

    <div class="text-center text-muted">

        RajaPulsa Admin Panel<br>

        Version 1.0

    </div>

</div>

{% endblock %}
